[project]
name = "knowledge-assistant-demo-v3"
version = "0.1.0"
description = "Contract Research Assistant — ResponsesAgent → MLflow AgentServer Apps-async port (reference build)"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "mlflow>=3.10.0",
  "databricks-sdk>=0.107.0",
  "databricks-vectorsearch>=0.40",
  "databricks-openai>=0.13.0",
  "databricks-agents>=1.9.3",
  "openai>=1.50.0",
  "psycopg[binary,pool]>=3.2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
# Local-only deps for regenerating the synthetic contract corpus.
# Not needed for the app at runtime — the PDFs are committed under data/.
pipeline = [
  "reportlab>=4.0",
  "pydantic>=2.0",
  "datasets>=2.14",
]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
