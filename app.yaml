command: ['uvicorn', 'server.start_server:app', '--host', '0.0.0.0', '--port', '$DATABRICKS_APP_PORT']

# OAuth scopes the Databricks Apps proxy requests when minting per-user
# X-Forwarded-Access-Token. Required for OBO calls to:
#  - serving.serving-endpoints: invoke the LLM endpoint via OpenAI-compat Foundation Model API.
#  - vectorsearch.vector-search-endpoints: query the Vector Search index as the user.
user_authorization:
  scopes:
    - serving.serving-endpoints
    - vectorsearch.vector-search-endpoints

env:
  - name: PYTHONUNBUFFERED
    value: '1'
  - name: PYTHONPATH
    value: /app/python/source_code
  - name: AGENT_CONFIG_PATH
    value: agent_config.yaml

  # Citation PDF serving — whitelist the source Volume(s) the citation route
  # (server/routes/documents.py) may read. Must match where ingest staged the
  # corpus: /Volumes/{catalog}/{schema}/{volume}/ from databricks.yml
  # (serverless_stable_ekaiik_catalog / contract_research / contracts).
  # Comma-separated for multiple. Without this it falls back to the old v3
  # volume default and every citation 403s ("path outside allowed volumes").
  - name: KA_ALLOWED_VOLUME_PREFIXES
    value: /Volumes/serverless_stable_ekaiik_catalog/contract_research/contracts/

  # MLflow tracing → Unity Catalog (mas-demo-app pattern; configure day-one so
  # OTel tables populate from first request — avoids v2's sync gap).
  # The app SP needs: USE_CATALOG on KA_TRACE_CATALOG, USE_SCHEMA on
  # KA_TRACE_CATALOG.KA_TRACE_SCHEMA, MODIFY + SELECT on the auto-created
  # `<prefix>_otel_*` tables, and CAN_USE on the SQL warehouse below.
  - name: MLFLOW_TRACKING_URI
    value: databricks
  - name: MLFLOW_EXPERIMENT_NAME
    value: /Shared/contract_research_assistant
  - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID
    value: 'fd0836278b403a0e'  # Serverless Starter Warehouse — fevm-stable-ekaiik
  - name: KA_TRACE_CATALOG
    value: serverless_stable_ekaiik_catalog
  - name: KA_TRACE_SCHEMA
    value: contract_research_audit
  - name: KA_TRACE_TABLE_PREFIX
    value: ka_v3

  # Lakebase Autoscaling — autoscaling tier skips resource binding. Set all
  # connection vars explicitly here (PGHOST/PGUSER/PGPORT/PGDATABASE/ENDPOINT_NAME).
  # The App SP must be registered via `databricks postgres create-role` after
  # `databricks apps create` reveals the SP client_id (see scripts/deploy.sh).
  # Lakebase chat history ENABLED. Project: contract-research-chat (Autoscaling,
  # pg17). The App SP is registered as Postgres role sp-contract-research via
  # `databricks postgres create-role` (identity_type SERVICE_PRINCIPAL); PGUSER
  # is that SP client_id. Schema bootstrapped from scripts/bootstrap_schema.sql.
  - name: ENDPOINT_NAME
    value: 'projects/contract-research-chat/branches/production/endpoints/primary'
  - name: PGHOST
    value: 'ep-bold-dew-d2upyvj6.database.us-east-1.cloud.databricks.com'
  - name: PGDATABASE
    value: 'databricks_postgres'
  - name: PGPORT
    value: '5432'
  - name: PGSSLMODE
    value: 'require'
  - name: PGUSER
    value: '28070953-9229-4f66-ae01-c85bc370f54b'
