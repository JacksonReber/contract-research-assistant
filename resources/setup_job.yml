resources:
  jobs:
    setup_job:
      name: '[${bundle.target}] contract-research-assistant · pipeline setup'
      description: >-
        Ingest PDFs from data/ → parsed_contracts (ai_parse_document)
        → search_ready (ai_prep_search) → Vector Search Delta-Sync index.
        Run once before deploying the app via scripts/deploy.sh.
        Serverless compute (workspace is serverless-only).
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/00_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              audit_schema: ${var.audit_schema}
              source_root: ${workspace.file_path}/data
        - task_key: parse
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/01_parse.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              audit_schema: ${var.audit_schema}
        - task_key: chunk_index
          depends_on:
            - task_key: parse
          notebook_task:
            notebook_path: ../notebooks/02_chunk_index.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              audit_schema: ${var.audit_schema}
              vs_endpoint: ${var.vs_endpoint}
